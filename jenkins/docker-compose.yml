version: "3.8"

services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080" # Cổng truy cập giao diện Jenkins (nếu cổng 8080 trùng với app khác của bạn, có thể đổi thành "8081:8080")
      - "50000:50000" # Cổng cho Jenkins Agent kết nối
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock # Cho phép Jenkins gọi Docker daemon trên server để build/deploy app
    user: root # Chạy dưới quyền root để Jenkins có quyền thực thi lệnh docker compose trên host
    networks:
      - shared-net

networks:
  shared-net:
    external: true
